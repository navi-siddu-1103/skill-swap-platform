<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta
      name="description"
      content="Skill Swap — Peer-to-peer platform empowering you to share your expertise, discover talents, and swap skills."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Skill Swap — Peer-to-Peer Learning Platform</title>
    <style>
      /* Pre-react instant splash styling to eliminate any white flash */
      body {
        margin: 0;
        background-color: #0f172a;
      }
      #pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="pre-splash">
        <div style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;">Skill Swap</div>
        <div style="font-size: 0.8rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #a5b4fc;">Connect • Learn • Grow</div>
      </div>
    </div>
  </body>
