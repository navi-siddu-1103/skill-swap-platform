# Production Configuration (Render / Cloud Deployment)
server.port=${PORT:9091}

# Database Configuration:
# - If SPRING_DATASOURCE_URL is set in Render Environment Variables, it connects to your Cloud MySQL database.
# - If SPRING_DATASOURCE_URL is NOT set, it falls back to an embedded H2 database,
#   guaranteeing that Render starts up immediately without crashing!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:skill_swap_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSON Date Formatting (ISO String instead of Array)
spring.jackson.serialization.write-dates-as-timestamps=false

# Frontend URL for CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}
