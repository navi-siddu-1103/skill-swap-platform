# Server Port (Render sets the PORT environment variable dynamically)
server.port=${PORT:9091}

# Database Configuration (default to local MySQL for local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skill_swap_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Naveen@1103}

# JPA / Hibernate (Dialect is auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# JSON Date Formatting (ISO String instead of Array)
spring.jackson.serialization.write-dates-as-timestamps=false

# Frontend URL for CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}
